name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # lets the job sign in to AWS with GitHub's OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  BUCKET: jpdubouchard.ca
  # Prefer the secret (masked in the public logs); fall back to the variable
  DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          # Prefer the secret (masked in the public logs); fall back to the variable
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload site to S3
        run: |
          aws s3 sync . "s3://$BUCKET" \
            --exclude ".git/*" --exclude ".github/*" --exclude "README*" --exclude "DECISIONS.md" --exclude "CLAUDE.md"

      - name: Refresh CloudFront cache
        run: |
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "::error::Set the CLOUDFRONT_DISTRIBUTION_ID repo secret (or variable)"
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*"
